name: Release Creation

on:
  release:
    types: [published]

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenerate the module.json "description" from README.md so they never drift apart
      - name: Generate description from README
        run: |
          npm install
          npm run build:description

      # FoundryVTT's Package Release API has no "description" field - it only updates version/compatibility/download links, never the package page's description. That field must be pasted in by hand on https://foundryvtt.com/packages/<id>/edit/ whenever the README's content changes, so surface the generated HTML here to make copying it painless.
      - name: Print description for manual Foundry sync
        run: |
          {
            echo "### Foundry package description";
            id=$(node -p "JSON.parse(require('fs').readFileSync('module.json', 'utf8')).id");
            echo "If the README content changed, copy the HTML below into the description field at https://foundryvtt.com/packages/$id/edit/";
            echo '```html';
            node -p "JSON.parse(require('fs').readFileSync('module.json', 'utf8')).description";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      # Substitute the Manifest and Download URLs in the module.json
      - name: Substitute Manifest and Download Links For Versioned Ones
        id: sub_manifest_link_version
        uses: microsoft/variable-substitution@v1
        with:
          files: 'module.json'
        env:
          version: ${{github.event.release.tag_name}}
          url: https://github.com/${{github.repository}}
          manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
          download: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/mythras-angrygorillas-custom-macros.zip

      # Create a zip file with all files required by the module to add to the release.
      # README.md and images/readme/ (used for the module description's screenshots/GIFs) are
      # intentionally left out: those images are served from GitHub via raw.githubusercontent.com
      # links instead of being bundled, keeping the installed module's storage footprint small.
      - run: zip -r ./mythras-angrygorillas-custom-macros.zip module.json LICENSE packs/ images/icons/ esmodules/ styles/

      # Create a release for this specific version
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./mythras-angrygorillas-custom-macros.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

      # Release the module to Foundry
      - name: Publish Module to FoundryVTT Website
        id: publish-to-foundry-website
        uses: cs96and/FoundryVTT-release-package@v1
        with:
          package-token: ${{ secrets.FOUNDRY_PACKAGE_TOKEN }}
          manifest-url: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.json
